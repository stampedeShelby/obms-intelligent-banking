name: CI

# Phase-2 evidence pipeline.
#
# This workflow is the project's verification harness. It produces, on every
# push, the three things the Phase-2 assessment asks for:
#   1. a build that compiles,
#   2. unit and API/integration test runs with visible passing logs,
#   3. static code analysis output with a critical-bug count.
#
# Screenshots for the report are taken from the Actions run summary and from
# the uploaded artefacts.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend - build, test, static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        working-directory: backend
        run: mvn -B -ntp clean compile

      # Tests run against the H2 profile so no database server is needed in CI.
      # MySQL remains the deployment target; the schema shape is identical.
      - name: Run unit and API tests
        working-directory: backend
        run: mvn -B -ntp test

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit results
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: SpotBugs static analysis
        working-directory: backend
        run: mvn -B -ntp spotbugs:spotbugs

      - name: PMD static analysis
        working-directory: backend
        run: mvn -B -ntp pmd:pmd pmd:cpd

      # Fails the build on any SpotBugs finding of rank 1-9, which is the
      # "critical bug" definition used in the Phase-2 report. The threshold is
      # enforced here rather than trusted to a human reading the HTML.
      # Fails the build on any SpotBugs finding of rank 1-9, which is the
      # "critical bug" definition used in the Phase-2 report. The threshold is
      # enforced here rather than trusted to a human reading the HTML.
      - name: Enforce zero critical findings
        working-directory: backend
        run: python3 ../scripts/check_spotbugs.py target/spotbugsXml.xml

      - name: Upload backend reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/spotbugs*.xml
            backend/target/spotbugs*.html
            backend/target/site/
            backend/target/pmd.xml
            backend/target/cpd.xml
            backend/target/site/jacoco/
          if-no-files-found: warn

  ai-service:
    name: AI service - lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff lint
        working-directory: ai-service
        run: ruff check .

      - name: Pytest
        working-directory: ai-service
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload AI service reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-service-reports
          path: ai-service/pytest-report.xml
          if-no-files-found: warn

  frontend:
    name: Frontend - typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Production build
        working-directory: frontend
        run: npm run build

  mysql-schema:
    name: MySQL integration and schema generation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: obms_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Runs MySqlSchemaIT, which the ordinary test job skips (Surefire's
      # default includes exclude *IT). This is the only place the JPA mappings
      # meet a real MySQL server and its dialect; everything else runs on H2.
      - name: Verify JPA mappings against MySQL and create the schema
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: obms_schema
          DB_USERNAME: root
          DB_PASSWORD: rootpassword
        run: mvn -B -ntp test -Dtest=MySqlSchemaIT -DfailIfNoSpecifiedTests=false

      # Dumped with the same mysql image as the service, so client and server
      # versions cannot disagree.
      - name: Dump schema and reference data
        run: |
          set -euo pipefail
          mkdir -p database

          DUMP="docker run --rm --network host mysql:8.4 mysqldump
                -h 127.0.0.1 -P 3306 -u root -prootpassword --skip-comments"

          {
            echo "-- OBMS - MySQL schema"
            echo "--"
            echo "-- GENERATED FILE. Do not edit by hand."
            echo "--"
            echo "-- Produced by the mysql-schema CI job: the Spring Boot"
            echo "-- application boots against MySQL 8.4, Hibernate creates the"
            echo "-- schema from the JPA entity mappings, and the result is"
            echo "-- dumped here. Editing an entity regenerates this file, so it"
            echo "-- cannot drift from the code."
            echo "--"
            echo "-- Apply with:  mysql -u obms_user -p obms < database/schema.sql"
            echo ""
            echo "SET FOREIGN_KEY_CHECKS = 0;"
            echo ""
            $DUMP --no-data obms_schema
            echo ""
            echo "SET FOREIGN_KEY_CHECKS = 1;"
          } > database/schema.sql

          {
            echo "-- OBMS - reference data"
            echo "--"
            echo "-- GENERATED FILE. Do not edit by hand."
            echo "--"
            echo "-- The roles and biller catalogue that ReferenceDataSeeder"
            echo "-- inserts at startup. Apply after schema.sql if you want the"
            echo "-- reference rows without running the application."
            echo "--"
            echo "-- Demo customers and their transaction history are NOT here:"
            echo "-- they are generated at runtime with randomised amounts by"
            echo "-- DemoDataSeeder, enabled with OBMS_DEMO=true."
            echo ""
            $DUMP --no-create-info --complete-insert obms_schema roles billers
          } > database/seed.sql

          echo "schema.sql: $(wc -l < database/schema.sql) lines, $(grep -c 'CREATE TABLE' database/schema.sql) tables"
          echo "seed.sql:   $(wc -l < database/seed.sql) lines"

      - name: Summarise generated schema
        run: |
          {
            echo "### MySQL schema generation"
            echo ""
            echo "Application context started against MySQL 8.4 and Hibernate created the schema from the JPA mappings."
            echo ""
            echo "| Artefact | Tables | Lines |"
            echo "|---|---:|---:|"
            echo "| database/schema.sql | $(grep -c 'CREATE TABLE' database/schema.sql) | $(wc -l < database/schema.sql) |"
            echo "| database/seed.sql | - | $(wc -l < database/seed.sql) |"
            echo ""
            echo "Tables created:"
            echo ""
            grep -oE 'CREATE TABLE `[a-z_]+`' database/schema.sql | sed 's/CREATE TABLE //' | tr -d '`' | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      # A push made with GITHUB_TOKEN does not trigger workflows, so committing
      # the regenerated schema here cannot loop.
      - name: Commit the generated schema if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- database/; then
            echo "Schema unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/schema.sql database/seed.sql
          git commit -m "Regenerate database schema from JPA mappings [ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload schema artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-schema
          path: database/
          if-no-files-found: warn
