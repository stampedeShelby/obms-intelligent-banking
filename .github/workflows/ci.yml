name: CI

# Phase-2 evidence pipeline.
#
# This workflow is the project's verification harness. It produces, on every
# push, the three things the Phase-2 assessment asks for:
#   1. a build that compiles,
#   2. unit and API/integration test runs with visible passing logs,
#   3. static code analysis output with a critical-bug count.
#
# Screenshots for the report are taken from the Actions run summary and from
# the uploaded artefacts.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend - build, test, static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        working-directory: backend
        run: mvn -B -ntp clean compile

      # Tests run against the H2 profile so no database server is needed in CI.
      # MySQL remains the deployment target; the schema shape is identical.
      - name: Run unit and API tests
        working-directory: backend
        run: mvn -B -ntp test

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit results
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: SpotBugs static analysis
        working-directory: backend
        run: mvn -B -ntp spotbugs:spotbugs

      - name: PMD static analysis
        working-directory: backend
        run: mvn -B -ntp pmd:pmd pmd:cpd

      # Fails the build on any SpotBugs finding of rank 1-9, which is the
      # "critical bug" definition used in the Phase-2 report. The threshold is
      # enforced here rather than trusted to a human reading the HTML.
      # Fails the build on any SpotBugs finding of rank 1-9, which is the
      # "critical bug" definition used in the Phase-2 report. The threshold is
      # enforced here rather than trusted to a human reading the HTML.
      - name: Enforce zero critical findings
        working-directory: backend
        run: python3 ../scripts/check_spotbugs.py target/spotbugsXml.xml

      - name: Upload backend reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/spotbugs*.xml
            backend/target/spotbugs*.html
            backend/target/site/
            backend/target/pmd.xml
            backend/target/cpd.xml
            backend/target/site/jacoco/
          if-no-files-found: warn

  ai-service:
    name: AI service - lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff lint
        working-directory: ai-service
        run: ruff check .

      - name: Pytest
        working-directory: ai-service
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload AI service reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-service-reports
          path: ai-service/pytest-report.xml
          if-no-files-found: warn

  frontend:
    name: Frontend - typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Production build
        working-directory: frontend
        run: npm run build
