server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns its routes, so an unknown path must return index.html
    # rather than a 404 - otherwise a refresh on /app/transfer breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the API so the browser makes same-origin requests.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
